# Every push: JS tests on the runner, C# tests and the publish inside the .NET SDK container (the shared
# runner image has node and the docker CLI, never dotnet). On main, when meta.json names a version that
# has no release yet: zip the plugin, create the release with the zip attached, and commit the updated
# manifest.json back to main, which is the plugin repository Jellyfin polls.
name: CI

on:
  push:

jobs:
  build:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the pinned Butterchurn bundles
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Client script tests
        run: npm test

      - name: Build, test and publish the plugin (inside the .NET SDK image)
        run: |
          rm -rf dist
          docker build --target artifact -o dist .
          ls -l dist

      - name: Package
        id: package
        run: |
          VERSION=$(node -p "require('./meta.json').version")
          ZIP="jellybutter_${VERSION}.zip"
          rm -f "${ZIP}"
          node .forgejo/scripts/make-zip.js "${ZIP}" dist/Jellyfin.Plugin.Jellybutter.dll dist/meta.json dist/THIRD-PARTY-NOTICES.txt
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"
          md5sum "${ZIP}"

      - name: Release and update the manifest (main, new version only)
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          # The host Jellyfin servers download releases from, as written into manifest.json: the Actions
          # variable PLUGIN_BASE_URL when set (a hostname, so no LAN address lands in the repo), else
          # the Forgejo URL itself.
          BASE: ${{ vars.PLUGIN_BASE_URL || github.server_url }}
          VERSION: ${{ steps.package.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -eu
          TAG="v${VERSION}"
          if curl -sf -H "Authorization: token ${TOKEN}" "${API}/releases/tags/${TAG}" >/dev/null; then
            echo "release ${TAG} exists; bump the version in meta.json to publish a new one"
            exit 0
          fi
          NOTES=$(node -p "require('./meta.json').changelog")
          BODY=$(node -e 'const [t,n]=process.argv.slice(1); console.log(JSON.stringify({tag_name:t,name:t,body:n,target_commitish:process.env.GITHUB_SHA}))' "${TAG}" "${NOTES}")
          RELEASE_ID=$(curl -sf -X POST -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" \
            -d "${BODY}" "${API}/releases" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).id")
          curl -sf -X POST -H "Authorization: token ${TOKEN}" \
            -F "attachment=@${ZIP}" "${API}/releases/${RELEASE_ID}/assets?name=${ZIP}" >/dev/null
          URL="${BASE}/${{ github.repository }}/releases/download/${TAG}/${ZIP}"
          node .forgejo/scripts/update-manifest.js manifest.json meta.json "${ZIP}" "${URL}"
          git config user.name "forgejo-actions"
          git config user.email "actions@noreply.local"
          git add manifest.json
          git commit -m "chore(release): ${TAG} in manifest.json [skip ci]" -m "Published by CI: ${URL}"
          REMOTE="${{ github.server_url }}/${{ github.repository }}.git"
          git push "$(echo "${REMOTE}" | sed "s#://#://oauth2:${TOKEN}@#")" HEAD:main
