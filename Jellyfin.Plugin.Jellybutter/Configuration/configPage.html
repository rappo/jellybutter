<!DOCTYPE html>
<html>
<head>
    <title>Jellybutter Visualizer</title>
</head>
<body>
<div id="JellybutterConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox,emby-select">
    <style>
        .jellybutter-help { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 1.3em; height: 1.3em; margin-left: .4em; border-radius: 50%; border: 1px solid currentColor; font-size: .8em; line-height: 1; opacity: .7; cursor: help; vertical-align: middle; }
        .jellybutter-help:hover, .jellybutter-help:focus { opacity: 1; outline: none; }
        .jellybutter-help .jellybutter-tip { position: absolute; left: 0; top: 1.7em; z-index: 10; width: max-content; max-width: min(24em, 70vw); padding: .5em .7em; border-radius: .4em; background: #202020; color: #fff; font-size: 1.1em; font-weight: 400; line-height: 1.35; white-space: normal; box-shadow: 0 .2em .8em rgba(0,0,0,.5); display: none; }
        .jellybutter-help.jellybutter-flip .jellybutter-tip { left: auto; right: 0; }
        .jellybutter-help:hover .jellybutter-tip, .jellybutter-help:focus .jellybutter-tip { display: block; }
        .jellybutter-label { display: inline-flex; align-items: center; }
        .jellybutter-version { opacity: .6; font-size: .9em; }
    </style>
    <div data-role="content">
        <div class="content-primary">
            <form id="JellybutterConfigForm">
                <div class="verticalSection">
                    <h2 class="sectionTitle">Jellybutter Visualizer <span id="jellybutterVersion" class="jellybutter-version"></span></h2>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input is="emby-checkbox" type="checkbox" id="jellybutterEnabled" />
                            <span class="jellybutter-label">Add the visualizer to the web client
                                <span class="jellybutter-help" tabindex="0" role="note"><span aria-hidden="true">?</span><span class="jellybutter-tip">Off, the server serves the web client untouched and the visualizer files answer 404. Takes effect on the next page load.</span></span>
                            </span>
                        </label>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input is="emby-checkbox" type="checkbox" id="jellybutterDesktopWebAudio" />
                            <span class="jellybutter-label">Play music in the web player on Jellyfin Desktop
                                <span class="jellybutter-help" tabindex="0" role="note"><span aria-hidden="true">?</span><span class="jellybutter-tip">Jellyfin Desktop plays music through mpv, which the visualizer cannot hear. On, music goes through the web player instead; video stays on mpv.</span></span>
                            </span>
                        </label>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused jellybutter-label" for="jellybutterCycleSeconds">Change preset every (seconds)
                            <span class="jellybutter-help" tabindex="0" role="note"><span aria-hidden="true">?</span><span class="jellybutter-tip">0 keeps the current preset until you change it (b next, n previous).</span></span>
                        </label>
                        <input is="emby-input" type="number" id="jellybutterCycleSeconds" min="0" max="3600" step="1" required />
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused jellybutter-label" for="jellybutterBlendSeconds">Blend between presets (seconds)
                            <span class="jellybutter-help" tabindex="0" role="note"><span aria-hidden="true">?</span><span class="jellybutter-tip">How long one preset fades into the next. 0 switches instantly.</span></span>
                        </label>
                        <input is="emby-input" type="number" id="jellybutterBlendSeconds" min="0" max="30" step="0.1" required />
                    </div>
                </div>
                <div class="verticalSection">
                    <h2 class="sectionTitle">Buttons and views</h2>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input is="emby-checkbox" type="checkbox" id="jellybutterControlButton" />
                            <span class="jellybutter-label">Visualizer button in the Now Playing controls
                                <span class="jellybutter-help" tabindex="0" role="note"><span aria-hidden="true">?</span><span class="jellybutter-tip">An icon button between Lyrics and Shuffle on the Now Playing page.</span></span>
                            </span>
                        </label>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input is="emby-checkbox" type="checkbox" id="jellybutterFloatingButton" />
                            <span class="jellybutter-label">Floating visualizer button on other pages
                                <span class="jellybutter-help" tabindex="0" role="note"><span aria-hidden="true">?</span><span class="jellybutter-tip">A round button at the bottom right while a track is loaded, wherever the Now Playing controls are not on screen. The v key works everywhere regardless.</span></span>
                            </span>
                        </label>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input is="emby-checkbox" type="checkbox" id="jellybutterNowPlayingBar" />
                            <span class="jellybutter-label">Now Playing bar under the visualizer
                                <span class="jellybutter-help" tabindex="0" role="note"><span aria-hidden="true">?</span><span class="jellybutter-tip">The playback bar (track, artist, controls) along the bottom while the visualizer is open: the web client's own, or the visualizer's in the TV layout.</span></span>
                            </span>
                        </label>
                    </div>
                    <div class="selectContainer">
                        <label class="selectLabel jellybutter-label" for="jellybutterDefaultView">Opens as
                            <span class="jellybutter-help" tabindex="0" role="note"><span aria-hidden="true">?</span><span class="jellybutter-tip">The view the visualizer starts in. The l key or the Lyrics button switches lyrics on and off while it is open.</span></span>
                        </label>
                        <select is="emby-select" id="jellybutterDefaultView">
                            <option value="visualizer">Visualizer only</option>
                            <option value="lyrics">Visualizer with lyrics</option>
                        </select>
                    </div>
                    <div class="selectContainer">
                        <label class="selectLabel jellybutter-label" for="jellybutterLyricsSize">Lyrics text size
                            <span class="jellybutter-help" tabindex="0" role="note"><span aria-hidden="true">?</span><span class="jellybutter-tip">The size of the lyrics over the visualizer. Lyrics come from the track's lyrics in Jellyfin (synced lines follow the music).</span></span>
                        </label>
                        <select is="emby-select" id="jellybutterLyricsSize">
                            <option value="small">Small</option>
                            <option value="medium">Medium</option>
                            <option value="large">Large</option>
                        </select>
                    </div>
                    <p>In the player: the visualizer button appears while a track is loaded. Hotkeys: <strong>v</strong> toggle, <strong>l</strong> lyrics, <strong>b</strong> next preset, <strong>n</strong> previous preset. <strong>Escape</strong> or Back hides the controls, a second time closes.</p>
                </div>
                <div class="verticalSection">
                    <h2 class="sectionTitle">When idle</h2>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input is="emby-checkbox" type="checkbox" id="jellybutterIdleVisualizer" />
                            <span class="jellybutter-label">Open the visualizer when idle
                                <span class="jellybutter-help" tabindex="0" role="note"><span aria-hidden="true">?</span><span class="jellybutter-tip">While music plays and nothing is pressed for the minutes below, the visualizer opens full screen by itself.</span></span>
                            </span>
                        </label>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused jellybutter-label" for="jellybutterIdleMinutes">Idle time (minutes)
                            <span class="jellybutter-help" tabindex="0" role="note"><span aria-hidden="true">?</span><span class="jellybutter-tip">1 to 60.</span></span>
                        </label>
                        <input is="emby-input" type="number" id="jellybutterIdleMinutes" min="1" max="60" step="1" required />
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input is="emby-checkbox" type="checkbox" id="jellybutterIdleHideUi" />
                            <span class="jellybutter-label">Hide the controls when it opens
                                <span class="jellybutter-help" tabindex="0" role="note"><span aria-hidden="true">?</span><span class="jellybutter-tip">Only the track, artwork, time and progress stay on screen. Any key brings the controls back.</span></span>
                            </span>
                        </label>
                    </div>
                </div>
                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span>Save</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        (function () {
            var pluginId = '7efeb814-3e67-466d-a2a1-6842ef86a500';
            var page = document.querySelector('#JellybutterConfigPage');

            function load() {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                    page.querySelector('#jellybutterEnabled').checked = config.Enabled !== false;
                    page.querySelector('#jellybutterDesktopWebAudio').checked = config.DesktopWebAudio !== false;
                    page.querySelector('#jellybutterCycleSeconds').value = typeof config.CycleSeconds === 'number' ? config.CycleSeconds : 30;
                    page.querySelector('#jellybutterBlendSeconds').value = typeof config.BlendSeconds === 'number' ? config.BlendSeconds : 2.7;
                    page.querySelector('#jellybutterControlButton').checked = config.ControlButton !== false;
                    page.querySelector('#jellybutterFloatingButton').checked = config.FloatingButton !== false;
                    page.querySelector('#jellybutterNowPlayingBar').checked = config.NowPlayingBar !== false;
                    page.querySelector('#jellybutterDefaultView').value = config.DefaultView === 'lyrics' ? 'lyrics' : 'visualizer';
                    page.querySelector('#jellybutterLyricsSize').value = ['small', 'medium', 'large'].indexOf(config.LyricsSize) >= 0 ? config.LyricsSize : 'medium';
                    page.querySelector('#jellybutterIdleVisualizer').checked = config.IdleVisualizer !== false;
                    page.querySelector('#jellybutterIdleMinutes').value = typeof config.IdleMinutes === 'number' ? config.IdleMinutes : 2;
                    page.querySelector('#jellybutterIdleHideUi').checked = config.IdleHideUi !== false;
                    syncIdle();
                    Dashboard.hideLoadingMsg();
                });
                ApiClient.getJSON(ApiClient.getUrl('Plugins')).then(function (plugins) {
                    var me = (plugins || []).filter(function (p) { return (p.Id || '').replace(/-/g, '') === pluginId.replace(/-/g, ''); })[0];
                    if (me && me.Version) { page.querySelector('#jellybutterVersion').textContent = 'v' + me.Version; }
                }).catch(function () { /* the version is a nicety */ });
            }

            // The idle options only mean something while the idle visualizer is on.
            function syncIdle() {
                var on = page.querySelector('#jellybutterIdleVisualizer').checked;
                page.querySelector('#jellybutterIdleMinutes').disabled = !on;
                page.querySelector('#jellybutterIdleHideUi').disabled = !on;
            }

            page.addEventListener('pageshow', load);
            page.querySelector('#jellybutterIdleVisualizer').addEventListener('change', syncIdle);

            // A tip opens toward the middle of the window: left-anchored from the left half, right-anchored
            // from the right half, so a short label near the left edge and a long one near the right edge
            // both keep their tip on screen.
            Array.prototype.forEach.call(page.querySelectorAll('.jellybutter-help'), function (help) {
                function place() {
                    var r = help.getBoundingClientRect();
                    help.classList.toggle('jellybutter-flip', r.left + r.width / 2 > window.innerWidth / 2);
                }
                help.addEventListener('mouseenter', place);
                help.addEventListener('focus', place);
            });

            page.querySelector('#JellybutterConfigForm').addEventListener('submit', function (e) {
                e.preventDefault();
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                    config.Enabled = page.querySelector('#jellybutterEnabled').checked;
                    config.DesktopWebAudio = page.querySelector('#jellybutterDesktopWebAudio').checked;
                    config.CycleSeconds = Math.max(0, Math.min(3600, Math.round(Number(page.querySelector('#jellybutterCycleSeconds').value) || 0)));
                    config.BlendSeconds = Math.max(0, Math.min(30, Number(page.querySelector('#jellybutterBlendSeconds').value) || 0));
                    config.ControlButton = page.querySelector('#jellybutterControlButton').checked;
                    config.FloatingButton = page.querySelector('#jellybutterFloatingButton').checked;
                    config.NowPlayingBar = page.querySelector('#jellybutterNowPlayingBar').checked;
                    config.DefaultView = page.querySelector('#jellybutterDefaultView').value;
                    config.LyricsSize = page.querySelector('#jellybutterLyricsSize').value;
                    config.IdleVisualizer = page.querySelector('#jellybutterIdleVisualizer').checked;
                    config.IdleMinutes = Math.max(1, Math.min(60, Math.round(Number(page.querySelector('#jellybutterIdleMinutes').value) || 2)));
                    config.IdleHideUi = page.querySelector('#jellybutterIdleHideUi').checked;
                    ApiClient.updatePluginConfiguration(pluginId, config).then(Dashboard.processPluginConfigurationUpdateResult);
                });
                return false;
            });
        })();
    </script>
</div>
</body>
</html>
