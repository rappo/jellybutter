<!DOCTYPE html>
<html>
<head>
    <title>Milkdrop Visualizer</title>
</head>
<body>
<div id="MilkdropConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
    <style>
        .milkdrop-help { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 1.3em; height: 1.3em; margin-left: .4em; border-radius: 50%; border: 1px solid currentColor; font-size: .8em; line-height: 1; opacity: .7; cursor: help; vertical-align: middle; }
        .milkdrop-help:hover, .milkdrop-help:focus { opacity: 1; outline: none; }
        .milkdrop-help .milkdrop-tip { position: absolute; right: 0; top: 1.7em; z-index: 10; width: max-content; max-width: min(24em, 70vw); padding: .5em .7em; border-radius: .4em; background: #202020; color: #fff; font-size: 1.1em; font-weight: 400; line-height: 1.35; white-space: normal; box-shadow: 0 .2em .8em rgba(0,0,0,.5); display: none; }
        .milkdrop-help:hover .milkdrop-tip, .milkdrop-help:focus .milkdrop-tip { display: block; }
        .milkdrop-label { display: inline-flex; align-items: center; }
        .milkdrop-version { opacity: .6; font-size: .9em; }
    </style>
    <div data-role="content">
        <div class="content-primary">
            <form id="MilkdropConfigForm">
                <div class="verticalSection">
                    <h2 class="sectionTitle">Milkdrop Visualizer <span id="milkdropVersion" class="milkdrop-version"></span></h2>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input is="emby-checkbox" type="checkbox" id="milkdropEnabled" />
                            <span class="milkdrop-label">Add the visualizer to the web client
                                <span class="milkdrop-help" tabindex="0" role="note"><span aria-hidden="true">?</span><span class="milkdrop-tip">Off, the server serves the web client untouched and the visualizer files answer 404. Takes effect on the next page load.</span></span>
                            </span>
                        </label>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input is="emby-checkbox" type="checkbox" id="milkdropDesktopWebAudio" />
                            <span class="milkdrop-label">Play music in the web player on Jellyfin Desktop
                                <span class="milkdrop-help" tabindex="0" role="note"><span aria-hidden="true">?</span><span class="milkdrop-tip">Jellyfin Desktop plays music through mpv, which the visualizer cannot hear. On, music goes through the web player instead; video stays on mpv.</span></span>
                            </span>
                        </label>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused milkdrop-label" for="milkdropCycleSeconds">Change preset every (seconds)
                            <span class="milkdrop-help" tabindex="0" role="note"><span aria-hidden="true">?</span><span class="milkdrop-tip">0 keeps the current preset until you change it (b next, n previous).</span></span>
                        </label>
                        <input is="emby-input" type="number" id="milkdropCycleSeconds" min="0" max="3600" step="1" required />
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused milkdrop-label" for="milkdropBlendSeconds">Blend between presets (seconds)
                            <span class="milkdrop-help" tabindex="0" role="note"><span aria-hidden="true">?</span><span class="milkdrop-tip">How long one preset fades into the next. 0 switches instantly.</span></span>
                        </label>
                        <input is="emby-input" type="number" id="milkdropBlendSeconds" min="0" max="30" step="0.1" required />
                    </div>
                    <p>In the player: the visualizer button appears while a track is loaded. Hotkeys: <strong>v</strong> toggle, <strong>b</strong> next preset, <strong>n</strong> previous preset, <strong>Escape</strong> close.</p>
                </div>
                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span>Save</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        (function () {
            var pluginId = '7efeb814-3e67-466d-a2a1-6842ef86a500';
            var page = document.querySelector('#MilkdropConfigPage');

            function load() {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                    page.querySelector('#milkdropEnabled').checked = config.Enabled !== false;
                    page.querySelector('#milkdropDesktopWebAudio').checked = config.DesktopWebAudio !== false;
                    page.querySelector('#milkdropCycleSeconds').value = typeof config.CycleSeconds === 'number' ? config.CycleSeconds : 30;
                    page.querySelector('#milkdropBlendSeconds').value = typeof config.BlendSeconds === 'number' ? config.BlendSeconds : 2.7;
                    Dashboard.hideLoadingMsg();
                });
                ApiClient.getJSON(ApiClient.getUrl('Plugins')).then(function (plugins) {
                    var me = (plugins || []).filter(function (p) { return (p.Id || '').replace(/-/g, '') === pluginId.replace(/-/g, ''); })[0];
                    if (me && me.Version) { page.querySelector('#milkdropVersion').textContent = 'v' + me.Version; }
                }).catch(function () { /* the version is a nicety */ });
            }

            page.addEventListener('pageshow', load);

            page.querySelector('#MilkdropConfigForm').addEventListener('submit', function (e) {
                e.preventDefault();
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(pluginId).then(function (config) {
                    config.Enabled = page.querySelector('#milkdropEnabled').checked;
                    config.DesktopWebAudio = page.querySelector('#milkdropDesktopWebAudio').checked;
                    config.CycleSeconds = Math.max(0, Math.min(3600, Math.round(Number(page.querySelector('#milkdropCycleSeconds').value) || 0)));
                    config.BlendSeconds = Math.max(0, Math.min(30, Number(page.querySelector('#milkdropBlendSeconds').value) || 0));
                    ApiClient.updatePluginConfiguration(pluginId, config).then(Dashboard.processPluginConfigurationUpdateResult);
                });
                return false;
            });
        })();
    </script>
</div>
</body>
</html>
